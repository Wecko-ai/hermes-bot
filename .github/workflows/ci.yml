name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx vite build
      - name: End-to-end run against the simulated gateway
        run: npm run test:e2e
      - name: Install gitleaks (pinned release)
        run: |
          GITLEAKS_VERSION=8.30.1
          ARCH="$(uname -m)"
          case "$ARCH" in
            arm64)
              GITLEAKS_ASSET="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
              GITLEAKS_SHA256=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
              ;;
            x86_64)
              GITLEAKS_ASSET="gitleaks_${GITLEAKS_VERSION}_darwin_x64.tar.gz"
              GITLEAKS_SHA256=dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709
              ;;
            *) echo "Unsupported macOS arch: $ARCH" >&2; exit 1 ;;
          esac
          curl -fsSL -o "/tmp/${GITLEAKS_ASSET}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ASSET}"
          echo "${GITLEAKS_SHA256}  /tmp/${GITLEAKS_ASSET}" | shasum -a 256 -c -
          tar -xzf "/tmp/${GITLEAKS_ASSET}" -C /tmp
          sudo install -m 0755 "/tmp/gitleaks" /usr/local/bin/gitleaks
      - name: Secret scan
        run: gitleaks git . --redact --no-banner

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Swift tests (dictation helper and native core)
        run: |
          swift test --package-path native/dictation
          swift test --package-path swift