name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx vite build
      - name: End-to-end run against the simulated gateway
        run: npm run test:e2e
      - name: Secret scan
        run: |
          brew install gitleaks
          gitleaks git . --redact --no-banner
